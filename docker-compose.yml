services:
  spotify-mcp:
    build: .
    image: spotify-mcp:local
    container_name: spotify-mcp
    # Stdio MCP transport: keep stdin open, no TTY (clients pipe JSON-RPC).
    stdin_open: true
    tty: false
    env_file:
      - .env
    volumes:
      # Persist the OAuth token cache across container restarts.
      # `npm run auth` (run on the host once) creates this file.
      - ./.spotify-tokens:/app/.spotify-tokens
    restart: "no"
